<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 320" width="1040" height="320" role="img" aria-label="Suspend and erase">
<title>Suspend and erase</title>
<style>
  svg { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --bg-primary:#f5f5f7; --bg-secondary:#ffffff; --bg-tertiary:#e5e5e7; --border:#c7c7cc; --text-primary:#1d1d1f;
    --text-secondary:#6e6e73; --text-tertiary:#8e8e93; --accent:#0071e3; --success:#248a3d; --warning:#c46a00; --error:#d70015; }
  @media (prefers-color-scheme: dark) { svg { --bg-primary:#1d1d1f; --bg-secondary:#2d2d2f; --bg-tertiary:#3d3d3f;
    --border:#424245; --text-primary:#f5f5f7; --text-secondary:#98989d; --text-tertiary:#636366; --accent:#0a84ff;
    --success:#30d158; --warning:#ff9f0a; --error:#ff453a; } }
</style>
<style>
  .b { fill:var(--bg-secondary); stroke:var(--border); stroke-width:1.5; }
  .g { fill:var(--bg-secondary); stroke:var(--success); stroke-width:2; }
  .o { fill:var(--bg-tertiary); stroke:var(--warning); stroke-width:2; }
  .r { fill:var(--bg-secondary); stroke:var(--error); stroke-width:2; }
  .a { fill:var(--bg-secondary); stroke:var(--accent); stroke-width:2; }
  .t { fill:var(--text-primary); font-size:13.5px; font-weight:700; }
  .s { fill:var(--text-secondary); font-size:11.5px; }
  .h { fill:var(--text-secondary); font-size:11.5px; font-weight:700; letter-spacing:.05em; }
  .ttl { fill:var(--text-primary); font-size:17px; font-weight:700; }
  .ar { fill:var(--text-secondary); font-size:18px; }
  .cy { fill:var(--bg-secondary); stroke:var(--success); stroke-width:1.5; }
  .cn { fill:var(--bg-secondary); stroke:var(--error); stroke-width:1.5; }
  .ct { fill:var(--text-primary); font-size:12px; }
  .cx { fill:var(--text-secondary); font-size:12px; text-decoration:line-through; }
  .th { fill:var(--bg-tertiary); stroke:var(--border); }
  .td { fill:var(--bg-secondary); stroke:var(--border); }
</style>
<rect x="0" y="0" width="1040" height="320" style="fill:var(--bg-primary)"/>
<text class="ttl" x="20" y="34">Suspend and erase</text><rect class="g" x="20" y="54" width="200" height="84" rx="9"/><text class="t" x="30" y="76">Running</text><text class="ar" x="229" y="102">⇄</text><rect class="o" x="254" y="54" width="200" height="84" rx="9"/><text class="t" x="264" y="76">Suspended</text><text class="s" x="264" y="94">stopped; data, backups and</text><text class="s" x="264" y="109">credentials kept; members</text><text class="s" x="264" y="124">told</text><text class="ar" x="463" y="102">→</text><rect class="r" x="488" y="54" width="200" height="84" rx="9"/><text class="t" x="498" y="76">Erased</text><text class="s" x="498" y="94">after a grace period</text><text class="h" x="20" y="176">ERASE, IN DETAIL — LIKE ANY SERVICE'S RECYCLE BIN</text><rect class="b" x="20" y="188" width="170" height="108" rx="9"/><text class="t" x="30" y="210">Erase</text><text class="s" x="30" y="228">confirm by typing the</text><text class="s" x="30" y="243">hq's address; at once,</text><text class="s" x="30" y="258">or on a date with a</text><text class="s" x="30" y="273">countdown shown in hq</text><text class="ar" x="199" y="248">→</text><rect class="g" x="224" y="188" width="170" height="108" rx="9"/><text class="t" x="234" y="210">Final sealed backup</text><text class="s" x="234" y="228">everything exported</text><text class="ar" x="403" y="248">→</text><rect class="r" x="428" y="188" width="170" height="108" rx="9"/><text class="t" x="438" y="210">Running data removed</text><text class="ar" x="607" y="248">→</text><rect class="o" x="632" y="188" width="170" height="108" rx="9"/><text class="t" x="642" y="210">Grace period</text><text class="s" x="642" y="228">30 days by default; the</text><text class="s" x="642" y="243">final backup and</text><text class="s" x="642" y="258">off-site copies kept;</text><text class="s" x="642" y="273">restoring brings it</text><text class="s" x="642" y="288">back</text><text class="ar" x="811" y="248">→</text><rect class="r" x="836" y="188" width="170" height="108" rx="9"/><text class="t" x="846" y="210">Purged</text><text class="s" x="846" y="228">off-site copies</text><text class="s" x="846" y="243">included</text>
</svg>
