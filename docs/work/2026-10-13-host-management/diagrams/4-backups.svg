<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 538" width="1000" height="538" role="img" aria-label="Backups">
<title>Backups</title>
<style>
  svg { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --bg-primary:#f5f5f7; --bg-secondary:#ffffff; --bg-tertiary:#e5e5e7; --border:#c7c7cc; --text-primary:#1d1d1f;
    --text-secondary:#6e6e73; --text-tertiary:#8e8e93; --accent:#0071e3; --success:#248a3d; --warning:#c46a00; --error:#d70015; }
  @media (prefers-color-scheme: dark) { svg { --bg-primary:#1d1d1f; --bg-secondary:#2d2d2f; --bg-tertiary:#3d3d3f;
    --border:#424245; --text-primary:#f5f5f7; --text-secondary:#98989d; --text-tertiary:#636366; --accent:#0a84ff;
    --success:#30d158; --warning:#ff9f0a; --error:#ff453a; } }
</style><style>
  .b { fill:var(--bg-secondary); stroke:var(--border); stroke-width:1.5; }
  .g { fill:var(--bg-secondary); stroke:var(--success); stroke-width:2; }
  .o { fill:var(--bg-tertiary); stroke:var(--warning); stroke-width:2; }
  .r { fill:var(--bg-secondary); stroke:var(--error); stroke-width:2; }
  .a { fill:var(--bg-secondary); stroke:var(--accent); stroke-width:2; }
  .t { fill:var(--text-primary); font-size:13.5px; font-weight:700; }
  .s { fill:var(--text-secondary); font-size:11.5px; }
  .h { fill:var(--text-secondary); font-size:11.5px; font-weight:700; letter-spacing:.05em; }
  .ttl { fill:var(--text-primary); font-size:17px; font-weight:700; }
  .ar { fill:var(--text-secondary); font-size:18px; }
  .cy { fill:var(--bg-secondary); stroke:var(--success); stroke-width:1.5; }
  .cn { fill:var(--bg-secondary); stroke:var(--error); stroke-width:1.5; }
  .ct { fill:var(--text-primary); font-size:12px; }
  .cx { fill:var(--text-secondary); font-size:12px; text-decoration:line-through; }
  .th { fill:var(--bg-tertiary); stroke:var(--border); }
  .td { fill:var(--bg-secondary); stroke:var(--border); }
</style>
<rect x="0" y="0" width="1000" height="538" style="fill:var(--bg-primary)"/>
<text class="ttl" x="20" y="34">Backups — every site, each machine on its own, always sealed</text>
<text class="s" x="20" y="54">Each site backs up what it holds every night. A copy also goes to the organisation's backup location, if one is set.</text>
<text class="s" x="20" y="70">Agenthix Cloud is not a backup location for a self-hosted organisation; it backs up only the sites it hosts.</text>
<rect class="th" x="20" y="96" width="170" height="30"/><text class="t" x="28" y="116">Backup</text>
<rect class="th" x="190" y="96" width="250" height="30"/><text class="t" x="198" y="116">Where it is</text>
<rect class="th" x="440" y="96" width="270" height="30"/><text class="t" x="448" y="116">Who holds its key</text>
<rect class="th" x="710" y="96" width="270" height="30"/><text class="t" x="718" y="116">Protects against</text>
<rect class="td" x="20" y="126" width="170" height="46"/>
<text class="t" x="28" y="146">Nightly</text>
<rect class="td" x="190" y="126" width="250" height="46"/>
<text class="s" x="198" y="146">the site&#x27;s own machine, in the host</text>
<text class="s" x="198" y="162">service&#x27;s state folder, 02:00</text>
<rect class="td" x="440" y="126" width="270" height="46"/>
<text class="s" x="448" y="146">that machine&#x27;s host service</text>
<rect class="td" x="710" y="126" width="270" height="46"/>
<text class="s" x="718" y="146">a bad upgrade, a failed</text>
<text class="s" x="718" y="162">migration, a mistake</text>
<rect class="td" x="20" y="172" width="170" height="62"/>
<text class="t" x="28" y="192">Copy in the</text>
<text class="t" x="28" y="208">backup location</text>
<rect class="td" x="190" y="172" width="250" height="62"/>
<text class="s" x="198" y="192">a folder the organisation chooses:</text>
<text class="s" x="198" y="208">a network address, a NAS, a synced</text>
<text class="s" x="198" y="224">drive, a mounted bucket</text>
<rect class="td" x="440" y="172" width="270" height="62"/>
<text class="s" x="448" y="192">the person who set it: shown once,</text>
<text class="s" x="448" y="208">or saved as a small file</text>
<rect class="td" x="710" y="172" width="270" height="62"/>
<text class="s" x="718" y="192">losing the machine</text>
<rect class="td" x="20" y="234" width="170" height="46"/>
<text class="t" x="28" y="254">Move</text>
<rect class="td" x="190" y="234" width="250" height="46"/>
<text class="s" x="198" y="254">in transit to the receiving machine</text>
<rect class="td" x="440" y="234" width="270" height="46"/>
<text class="s" x="448" y="254">passed straight to the receiving</text>
<text class="s" x="448" y="270">host service</text>
<rect class="td" x="710" y="234" width="270" height="46"/>
<text class="s" x="718" y="254">—</text>
<rect class="td" x="20" y="280" width="170" height="46"/>
<text class="t" x="28" y="300">Export</text>
<rect class="td" x="190" y="280" width="250" height="46"/>
<text class="s" x="198" y="300">wherever the person takes it</text>
<rect class="td" x="440" y="280" width="270" height="46"/>
<text class="s" x="448" y="300">the person exporting: a key made</text>
<text class="s" x="448" y="316">for that export, shown once</text>
<rect class="td" x="710" y="280" width="270" height="46"/>
<text class="s" x="718" y="300">anything, if they keep the key</text>
<text class="s" x="718" y="316">with it</text>
<rect class="td" x="20" y="326" width="170" height="30"/>
<text class="t" x="28" y="346">Sites Cloud hosts</text>
<rect class="td" x="190" y="326" width="250" height="30"/>
<text class="s" x="198" y="346">Cloud&#x27;s storage</text>
<rect class="td" x="440" y="326" width="270" height="30"/>
<text class="s" x="448" y="346">Cloud, which runs those sites</text>
<rect class="td" x="710" y="326" width="270" height="30"/>
<text class="s" x="718" y="346">losing the machine</text>
<text class="h" x="20" y="380">WHAT A BACKUP HOLDS</text>
<rect class="g" x="20" y="390" width="470" height="54" rx="9"/><text class="t" x="32" y="412">A site</text><text class="s" x="32" y="430">its database and its workspaces (the projects' files)</text>
<rect class="a" x="510" y="390" width="470" height="54" rx="9"/><text class="t" x="522" y="412">hq's site</text><text class="s" x="522" y="430">the same, people's own storage included, and hq: its database, storage, secrets</text>
<text class="h" x="20" y="468">SAME NIGHT, SEPARATE BACKUPS</text>
<rect class="b" x="20" y="478" width="960" height="40" rx="9"/><text class="s" x="32" y="503">No combined backup across machines. After a restore, hq and the site reconcile, and hq says plainly what was lost.</text>
</svg>
