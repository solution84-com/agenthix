<svg viewBox="0 0 950 730"  xmlns="http://www.w3.org/2000/svg" width="950" height="730" role="img" aria-label="Trust boundaries">
<title>Trust boundaries</title>
<style>
  svg { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --bg-primary:#f5f5f7; --bg-secondary:#ffffff; --bg-tertiary:#e5e5e7; --border:#c7c7cc; --text-primary:#1d1d1f;
    --text-secondary:#6e6e73; --text-tertiary:#8e8e93; --accent:#0071e3; --success:#248a3d; --warning:#c46a00; --error:#d70015; }
  @media (prefers-color-scheme: dark) { svg { --bg-primary:#1d1d1f; --bg-secondary:#2d2d2f; --bg-tertiary:#3d3d3f;
    --border:#424245; --text-primary:#f5f5f7; --text-secondary:#98989d; --text-tertiary:#636366; --accent:#0a84ff;
    --success:#30d158; --warning:#ff9f0a; --error:#ff453a; } }
</style>
<rect x="0" y="0" width="950" height="730" style="fill:var(--bg-primary)"/>
  <defs>
    <marker id="f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--accent)"/></marker>
    <marker id="f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--text-tertiary)"/></marker>
  </defs>
  <style>
    .fp { fill:var(--bg-primary); stroke:var(--text-primary); stroke-width:1.8; }
    .fe { fill:var(--bg-secondary); stroke:var(--text-secondary); stroke-width:1.3; }
    .ftb { fill:none; stroke:var(--error); stroke-width:2; stroke-dasharray:8 5; }
    .ftbl { fill:var(--error); font-size:11.5px; font-weight:700; letter-spacing:.03em; }
    .ft { fill:var(--text-primary); font-size:15px; font-weight:700; }
    .fs { fill:var(--text-secondary); font-size:11.5px; }
    .fn { stroke:var(--accent); stroke-width:2.6; fill:none; }
    .fx { stroke:var(--text-tertiary); stroke-width:1.8; fill:none; stroke-dasharray:4 4; }
    .fc { fill:var(--error); font-size:12px; font-weight:800; }
    .fl { fill:var(--text-secondary); font-size:11px; }
  </style>
  <rect class="ftb" x="10" y="140" width="210" height="110" rx="10"/><text class="ftbl" x="22" y="160" style="font-size:10.5px">CLOUD — OUTSIDE THIS REPO</text><rect class="fe" x="22" y="170" width="186" height="56"/><text class="ft" x="34" y="194">Cloud's API</text><text class="fs" x="34" y="212">and its relay</text>
  <g transform="translate(250,0)">

  <!-- external entities -->
  <rect class="fe" x="90" y="16" width="180" height="46"/><text class="ft" x="104" y="38">Fleet admins</text><text class="fs" x="104" y="54">browser</text>
  <rect class="fe" x="440" y="16" width="180" height="46"/><text class="ft" x="454" y="38">People</text><text class="fs" x="454" y="54">browser</text>
  <rect class="fe" x="90" y="672" width="180" height="46"/><text class="ft" x="104" y="694">Machine admin</text><text class="fs" x="104" y="710">OS login or SSH</text>
  

  <!-- trust boundaries -->
  <rect class="ftb" x="40" y="110" width="640" height="150" rx="10"/><text class="ftbl" x="52" y="128">MACHINE A — hq's; the Host Manager runs here by default</text>
  <rect class="ftb" x="40" y="320" width="640" height="320" rx="10"/><text class="ftbl" x="52" y="338">MACHINE C — a site's (any machine; every machine has a host service)</text>
  <rect class="ftb" x="400" y="470" width="270" height="150" rx="10"/><text class="ftbl" x="412" y="610">AGENTS' PRIVATE NETWORK</text>
  
  <text class="fl" x="40" y="284">the network</text><text class="fl" x="40" y="298">between machines:</text><text class="fl" x="40" y="312">untrusted</text>

  <!-- processes -->
  <rect class="fp" x="70" y="160" width="230" height="64" rx="32"/><text class="ft" x="100" y="188">Host Manager</text><text class="fs" x="100" y="206">listens: 127.0.0.1 only</text>
  <rect class="fp" x="420" y="160" width="230" height="64" rx="32"/><text class="ft" x="450" y="188">hq</text><text class="fs" x="450" y="206">listens: people, sites, host services</text>
  <rect class="fp" x="70" y="380" width="230" height="64" rx="32"/><text class="ft" x="100" y="408">Host service</text><text class="fs" x="100" y="426">listens: owner's local socket only</text>
  <rect class="fp" x="420" y="380" width="230" height="64" rx="32"/><text class="ft" x="450" y="408">Site</text><text class="fs" x="450" y="426">listens: its agents' network only</text>
  <rect class="fp" x="420" y="520" width="230" height="64" rx="32"/><text class="ft" x="450" y="548">Agent containers</text><text class="fs" x="450" y="566">listen: nothing</text>

  <!-- flows -->
  <path class="fn" d="M180,62 L180,158" marker-end="url(#f1)"/><text class="fc" x="190" y="90">C1</text><text class="fl" x="190" y="104">on the machine, by SSH, or the remote tunnel</text>
  <path class="fn" d="M530,62 L530,158" marker-end="url(#f1)"/><text class="fc" x="540" y="100">C2</text>
  <path class="fn" d="M185,380 L185,300 L470,300 L470,226" marker-end="url(#f1)"/><text class="fc" x="195" y="292">C3</text><text class="fl" x="250" y="292">to hq's port, sealed for the Host Manager</text>
  <path class="fn" d="M302,192 L418,192" marker-end="url(#f1)"/><text class="fc" x="312" y="182">C8</text><text class="fl" x="336" y="182">dials out to hq</text><text class="fl" x="312" y="214">signed; hq relays it blind</text>
  <path class="fn" d="M535,380 L535,226" marker-end="url(#f1)"/><text class="fc" x="545" y="282">C4</text>
  <path class="fn" d="M535,520 L535,446" marker-end="url(#f1)"/><text class="fc" x="545" y="482">C5</text>
  <path class="fn" d="M70,198 L-38,198" marker-end="url(#f1)"/><text class="fc" x="-20" y="190">C6</text>
  <path class="fn" d="M180,672 L180,446" marker-end="url(#f1)"/><text class="fc" x="190" y="660">C7</text>
  <path class="fx" d="M418,412 L302,412" marker-end="url(#f2)"/><text class="fl" x="312" y="404">capacity figures</text><text class="fl" x="312" y="432">same machine</text>
  </g>
</svg>
