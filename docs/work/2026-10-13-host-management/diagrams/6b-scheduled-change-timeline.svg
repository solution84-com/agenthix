<svg viewBox="0 0 960 230"  xmlns="http://www.w3.org/2000/svg" width="960" height="230" role="img" aria-label="Scheduled changes: the timeline of one">
<title>Scheduled changes: the timeline of one</title>
<style>
  svg { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --bg-primary:#f5f5f7; --bg-secondary:#ffffff; --bg-tertiary:#e5e5e7; --border:#c7c7cc; --text-primary:#1d1d1f;
    --text-secondary:#6e6e73; --text-tertiary:#8e8e93; --accent:#0071e3; --success:#248a3d; --warning:#c46a00; --error:#d70015; }
  @media (prefers-color-scheme: dark) { svg { --bg-primary:#1d1d1f; --bg-secondary:#2d2d2f; --bg-tertiary:#3d3d3f;
    --border:#424245; --text-primary:#f5f5f7; --text-secondary:#98989d; --text-tertiary:#636366; --accent:#0a84ff;
    --success:#30d158; --warning:#ff9f0a; --error:#ff453a; } }
</style>
<rect x="0" y="0" width="960" height="230" style="fill:var(--bg-primary)"/>
  <style>
    .tl { stroke:var(--text-secondary); stroke-width:2.4; }
    .tp1 { fill:var(--accent); } .tp2 { fill:var(--warning); } .tp3 { fill:var(--error); } .tp4 { fill:var(--success); }
    .tt { fill:var(--text-primary); font-size:13px; font-weight:700; }
    .tx { fill:var(--text-secondary); font-size:11px; }
    .tband { fill:var(--warning); fill-opacity:.12; }
    .tband2 { fill:var(--error); fill-opacity:.12; }
  </style>
  <rect class="tband" x="470" y="64" width="190" height="34"/>
  <rect class="tband2" x="660" y="64" width="110" height="34"/>
  <line class="tl" x1="40" y1="80" x2="920" y2="80"/>
  <circle class="tp1" cx="60" cy="80" r="9"/><text class="tt" x="40" y="44">Scheduled</text><text class="tx" x="40" y="122">members see the notice:</text><text class="tx" x="40" y="138">what, when, what it affects</text>
  <circle class="tp1" cx="280" cy="80" r="7"/><text class="tt" x="250" y="44">Changed or cancelled</text><text class="tx" x="250" y="122">an updated notice,</text><text class="tx" x="250" y="138">the same route</text>
  <circle class="tp2" cx="470" cy="80" r="9"/><text class="tt" x="440" y="44">A few minutes before</text><text class="tx" x="440" y="122">no new runs on what is</text><text class="tx" x="440" y="138">affected; agents finish</text><text class="tx" x="440" y="154">their step and pause</text>
  <circle class="tp3" cx="660" cy="80" r="9"/><text class="tt" x="640" y="44">The time</text><text class="tx" x="640" y="122">the host service runs it</text>
  <circle class="tp4" cx="790" cy="80" r="9"/><text class="tt" x="770" y="44">Done</text><text class="tx" x="770" y="122">paused runs resume</text>
  <text class="tx" x="770" y="160" style="fill:var(--error);font-weight:700">Failed:</text><text class="tx" x="770" y="176">the host service rolls back;</text><text class="tx" x="770" y="192">hq says so, then resumes</text>
</svg>
