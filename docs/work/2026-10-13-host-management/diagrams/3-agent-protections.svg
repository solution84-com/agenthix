<svg viewBox="0 0 1250 650"  xmlns="http://www.w3.org/2000/svg" width="1250" height="650" role="img" aria-label="Agent protections">
<title>Agent protections</title>
<style>
  svg { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --bg-primary:#f5f5f7; --bg-secondary:#ffffff; --bg-tertiary:#e5e5e7; --border:#c7c7cc; --text-primary:#1d1d1f;
    --text-secondary:#6e6e73; --text-tertiary:#8e8e93; --accent:#0071e3; --success:#248a3d; --warning:#c46a00; --error:#d70015; }
  @media (prefers-color-scheme: dark) { svg { --bg-primary:#1d1d1f; --bg-secondary:#2d2d2f; --bg-tertiary:#3d3d3f;
    --border:#424245; --text-primary:#f5f5f7; --text-secondary:#98989d; --text-tertiary:#636366; --accent:#0a84ff;
    --success:#30d158; --warning:#ff9f0a; --error:#ff453a; } }
</style>
<rect x="0" y="0" width="1250" height="650" style="fill:var(--bg-primary)"/>
  <defs>
    <marker id="r1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--error)"/></marker>
    <marker id="r3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--success)"/></marker>
  </defs>
  <style>
    .xb { fill:var(--bg-primary); stroke:var(--border); stroke-width:1.4; }
    .xa { fill:var(--bg-primary); stroke:var(--error); stroke-width:2.4; }
    .xok { fill:var(--bg-primary); stroke:var(--success); stroke-width:2.2; }
    .xm { fill:none; stroke:var(--warning); stroke-width:2.2; }
    .xn { fill:none; stroke:var(--text-tertiary); stroke-width:1.5; stroke-dasharray:6 4; }
    .xwall { fill:var(--success); fill-opacity:.18; stroke:var(--success); stroke-width:2.4; }
    .xprox { fill:var(--bg-primary); stroke:var(--warning); stroke-width:2.8; }
    .xt { fill:var(--text-primary); font-size:14px; font-weight:700; }
    .xs { fill:var(--text-secondary); font-size:11.5px; }
    .xml { fill:var(--warning); font-size:11.5px; font-weight:700; letter-spacing:.04em; }
    .xr { stroke:var(--error); stroke-width:2.6; fill:none; }
    .xgo { stroke:var(--success); stroke-width:2.6; fill:none; }
    .xd { stroke:var(--text-secondary); stroke-width:1.6; fill:none; stroke-dasharray:4 4; }
    .xnum { fill:#fff; font-size:12px; font-weight:800; }
    .xc { fill:var(--error); }
    .xX { fill:var(--error); font-size:22px; font-weight:900; }
    .xA { fill:var(--success); font-size:13px; font-weight:800; }
    .xB { fill:var(--warning); font-size:13px; font-weight:800; }
  </style>

  <!-- attacker side -->
  <rect class="xa" x="20" y="30" width="200" height="66" rx="8"/><text class="xt" x="34" y="56">Attacker</text><text class="xs" x="34" y="74">never touches the machine</text><text class="xs" x="34" y="88">directly</text>
  <rect class="xb" x="20" y="170" width="200" height="80" rx="8"/><text class="xt" x="34" y="194">Something the agent reads</text><text class="xs" x="34" y="212">an issue, a web page, a README,</text><text class="xs" x="34" y="228">a dependency, an email</text>
  <path class="xr" d="M120,96 L120,168" marker-end="url(#r1)"/><circle class="xc" cx="140" cy="132" r="11"/><text class="xnum" x="136" y="137">1</text>

  <!-- machine -->
  <rect class="xm" x="270" y="20" width="720" height="610" rx="14"/>
  <text class="xml" x="286" y="42">A VPS RUNNING A SITE (OR hq AND ITS SITE)</text>

  <rect class="xn" x="290" y="140" width="260" height="290" rx="10"/><text class="xs" x="302" y="158">agent's container and private network</text>
  <rect class="xa" x="310" y="170" width="220" height="90" rx="10"/><text class="xt" x="324" y="196">Agent</text><text class="xs" x="324" y="214">follows the planted instruction</text><text class="xs" x="324" y="230">with its normal shell access</text>
  <rect class="xb" x="310" y="320" width="150" height="80" rx="8"/><text class="xt" x="322" y="344">Project's files</text><text class="xs" x="322" y="362">the agent may read</text><text class="xs" x="322" y="378">them — that's its job</text>
  <path class="xd" d="M385,320 L385,262"/>
  <path class="xr" d="M220,210 L308,210" marker-end="url(#r1)"/><circle class="xc" cx="262" cy="196" r="11"/><text class="xnum" x="258" y="201">2</text>

  <!-- A: the wall -->
  <rect class="xwall" x="582" y="60" width="34" height="400" rx="6"/>
  <text class="xA" x="0" y="0" transform="translate(604,450) rotate(-90)">A · FIREWALL RULES (HOST SERVICE)</text>

  <!-- targets -->
  <rect class="xb" x="660" y="66" width="210" height="66" rx="8"/><text class="xt" x="674" y="90">The machine's own ports</text><text class="xs" x="674" y="108">a database, an admin panel</text><text class="xs" x="674" y="122">on all interfaces</text>
  <rect class="xb" x="660" y="170" width="210" height="66" rx="8"/><text class="xt" x="674" y="194">Other containers' ports</text><text class="xs" x="674" y="212">other apps published</text><text class="xs" x="674" y="226">on the machine</text>
  <rect class="xb" x="660" y="274" width="210" height="80" rx="8"/><text class="xt" x="674" y="298">Metadata address</text><text class="xs" x="674" y="316">169.254.169.254 — hands out</text><text class="xs" x="674" y="330">the machine's cloud</text><text class="xs" x="674" y="344">credentials</text>

  <!-- attempts, stopped at the wall -->
  <path class="xr" d="M530,186 L580,100" marker-end="url(#r1)"/><text class="xX" x="620" y="104">✕</text>
  <path class="xr" d="M530,210 L580,203" marker-end="url(#r1)"/><text class="xX" x="620" y="210">✕</text>
  <path class="xr" d="M530,236 L580,312" marker-end="url(#r1)"/><text class="xX" x="620" y="320">✕</text>
  <circle class="xc" cx="560" cy="290" r="11"/><text class="xnum" x="556" y="295">3</text>
  <!-- direct internet, stopped (B) -->
  <path class="xr" d="M530,252 L580,410" marker-end="url(#r1)"/><text class="xX" x="620" y="420">✕</text>
  <text class="xB" x="646" y="404">B (later) · no direct route out</text><text class="xs" x="646" y="420">the agents' network leads</text><text class="xs" x="646" y="434">only to the proxy</text>

  <!-- B: the proxy -->
  <rect class="xprox" x="560" y="500" width="300" height="100" rx="10"/><text class="xB" x="576" y="524">B · EGRESS PROXY — LATER</text><text class="xs" x="576" y="544">the only way out for agents</text><text class="xs" x="576" y="560">lets through only the destinations</text><text class="xs" x="576" y="576">on the project's list</text>
  <path class="xgo" d="M480,262 L480,550 L558,550" marker-end="url(#r3)"/>
  <circle class="xc" cx="480" cy="460" r="11"/><text class="xnum" x="476" y="465">4</text>

  <!-- outside -->
  <rect class="xok" x="1020" y="440" width="215" height="72" rx="8"/><text class="xt" x="1034" y="464">Listed destinations</text><text class="xs" x="1034" y="482">package registries, model APIs,</text><text class="xs" x="1034" y="498">the project's own services</text>
  <rect class="xa" x="1020" y="540" width="215" height="72" rx="8"/><text class="xt" x="1034" y="564">Attacker's server</text><text class="xs" x="1034" y="582">not on the list</text><text class="xs" x="1034" y="598">nothing reaches it</text>
  <path class="xgo" d="M860,530 L1018,478" marker-end="url(#r3)"/><text class="xA" x="930" y="490">✓</text>
  <path class="xr" d="M860,575 L1018,575" marker-end="url(#r1)"/><text class="xX" x="930" y="570">✕</text>

  <rect class="xa" x="1020" y="66" width="215" height="110" rx="8"/><text class="xt" x="1034" y="90">VPS provider account</text><text class="xs" x="1034" y="108">today: with stolen credentials</text><text class="xs" x="1034" y="124">the attacker acts as the machine —</text><text class="xs" x="1034" y="140">copies its disks or deletes it</text><text class="xA" x="1034" y="164">with A: no credentials leave</text>
  <circle class="xc" cx="1000" cy="120" r="11"/><text class="xnum" x="996" y="125">5</text>
</svg>
