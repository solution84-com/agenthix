<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" width="100%" role="img" aria-label="People reach hq; Execution Sites connect out to hq and run agents">
    <defs>
      <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
      <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#818cf8"/></marker>
    </defs>
    <g font-family="Inter,system-ui,sans-serif">
      <rect x="170" y="10" width="220" height="54" rx="27" fill="#1c1c28" stroke="rgba(255,255,255,.14)"/>
      <text x="280" y="34" text-anchor="middle" fill="#ededf3" font-size="14" font-weight="600">You and your team</text>
      <text x="280" y="52" text-anchor="middle" fill="#a3a3b8" font-size="11">browser · phone · your own tools</text>
      <line x1="280" y1="66" x2="280" y2="104" stroke="#818cf8" stroke-width="2" marker-end="url(#ar)"/>
      <rect x="110" y="108" width="340" height="86" rx="14" fill="rgba(99,102,241,.14)" stroke="url(#g)" stroke-width="2"/>
      <text x="280" y="138" text-anchor="middle" fill="#ededf3" font-size="18" font-weight="600">hq</text>
      <text x="280" y="160" text-anchor="middle" fill="#a3a3b8" font-size="12">your organisation: people, projects, agents, tasks</text>
      <text x="280" y="178" text-anchor="middle" fill="#a3a3b8" font-size="12">the one place people open</text>
      <line x1="200" y1="240" x2="200" y2="198" stroke="#818cf8" stroke-width="2" marker-end="url(#ar)"/>
      <text x="208" y="224" fill="#6c6c82" font-size="11">connects out</text>
      <line x1="400" y1="240" x2="400" y2="198" stroke="#818cf8" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#ar)"/>
      <rect x="60" y="244" width="250" height="76" rx="14" fill="#13131c" stroke="rgba(255,255,255,.14)"/>
      <text x="185" y="270" text-anchor="middle" fill="#ededf3" font-size="15" font-weight="600">Execution Site</text>
      <text x="185" y="290" text-anchor="middle" fill="#a3a3b8" font-size="11">where agents run, in containers</text>
      <g transform="translate(130,298)"><rect width="30" height="14" rx="3" fill="#6366f1" opacity=".8"/><rect x="40" width="30" height="14" rx="3" fill="#6366f1" opacity=".6"/><rect x="80" width="30" height="14" rx="3" fill="#6366f1" opacity=".4"/></g>
      <rect x="330" y="244" width="170" height="76" rx="14" fill="none" stroke="rgba(255,255,255,.14)" stroke-dasharray="6 5"/>
      <text x="415" y="276" text-anchor="middle" fill="#a3a3b8" font-size="14" font-weight="500">More sites</text>
      <text x="415" y="296" text-anchor="middle" fill="#6c6c82" font-size="11">other machines, if you add them</text>
    </g>
  </svg>
