# gitleaks settings for this repository. The files allowed below hold fake secrets that tests and the demo need — a
# redactor's inputs, placeholder keys and machine credentials, canary values a test looks for, one-time-password
# secrets that are base32 of sample text, a self-signed certificate for a test host, the demo's deterministic session
# ids — never a real credential. Some are listed because an earlier commit holds them, though the file is gone now.
[extend]
useDefault = true

[allowlist]
description = "Test fixtures and demo data with fake secrets"
paths = [
  '''^console-web/src/__tests__/backupsPages\.test\.tsx$''',
  '''^console-web/src/__tests__/exportDownload\.test\.tsx$''',
