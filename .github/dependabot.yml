# Every base image is pinned by digest, so the images built on it keep their content keys until it is moved on
# purpose; this opens the pull request that moves it, once a week. Every action is pinned by commit, so the second
# entry opens the pull request that moves those pins.
version: 2
updates:
  - package-ecosystem: docker
    directories:
      - /hq/docker
      - /site/docker
      - /host/docker
      - /console/docker
      - /relay/docker
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
