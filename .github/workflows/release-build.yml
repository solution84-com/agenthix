name: Release build

# The release's own build, and the release bar's one run. Called by Release (release.yml) for the commit it releases,
# and also started by every push to a release branch and by hand for a commit (workflow_dispatch), it builds and proves
# everything a release ships except publishing it, and publishes nothing a person can reach: nothing built here carries
# a version, which the tag gives at publish. Called by Release, its jobs and artifacts are that run's.
#
# 1. The registry and the image names come from the branding module, the parts and their Dockerfiles from
#    scripts/images/parts.json, and each part's content key from scripts/images/keys.mjs, computed once here.
# 2. For each part and architecture the registry is asked for <image>:build-<key>-<arch> and for a build attestation
#    on it (scripts/release/reuse.sh). An image that is there and attested was built and started by this workflow on
#    main or a release branch for the same content: it is reused, not built. The rest is built on a runner of its own
#    architecture, started and made to answer (scripts/images/start-test.sh), pushed by digest and tagged
#    build-<key>-<arch>, and attested: cosign attests, keyless, a statement that names the part, architecture, key and
#    commit. Nothing is skipped silently: the run's page lists each part and architecture as reused or built.
# 3. The candidate record (the artifact `candidate`) holds the commit, its tree, and each part's key and platform
#    digests. The install test and the guide's screenshots run after the builds, as workflows this one calls
#    (install-test.yml, guide-screenshots.yml); the install test installs the candidate's amd64 images by digest.
# 4. @agenthix/core is type-checked, built, checked as a project outside this repository installs it, named for its
#    registry and packed.
#
# Nothing here signs an image for a host service: that signature names publish-images.yml at the version's tag
# (host/src/images/published.ts). The attestation made here is only how this workflow recognises its own builds.
on:
  push:
    branches: ['release/**']
  workflow_dispatch:
    inputs:
      commit:
        description: 'The commit to build and prove (the branch it is started from, main or a release branch, must hold it)'
        required: true
        type: string
  workflow_call:
    inputs:
      commit:
        description: 'The commit to build and prove'
        required: true
        type: string

concurrency:
  # A hand-started run is told its commit, and two runs from main for different commits are two builds; a push to a
  # release branch is told by the branch. Called by Release, the event is Release's, started by hand.
  group: release-build-${{ github.event_name == 'workflow_dispatch' && inputs.commit || github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  COSIGN_VERSION: v3.1.3

jobs:
  prepare:
    name: Registry, image names and what is already built
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Asks the registry what is there; a private package needs the token to be read.
      packages: read
    outputs:
      registry: ${{ steps.registry.outputs.registry }}
      names: ${{ steps.names.outputs.names }}
      keys: ${{ steps.keys.outputs.keys }}
      plan: ${{ steps.plan.outputs.plan }}
      missing: ${{ steps.plan.outputs.missing }}
      missing_count: ${{ steps.plan.outputs.missing_count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: The release scripts' own tests
        run: node --test "scripts/release/__tests__/*.test.mjs"
      - name: The registry
        id: registry
        run: |
          # Registry paths are lower case; the owner's name may not be.
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: The parts and their content keys
        id: keys
        run: |
          echo "keys=$(node scripts/images/keys.mjs --json)" >> "$GITHUB_OUTPUT"
          echo "images=$(node scripts/images/parts.mjs | jq -R -s -c 'split("\n") | map(select(length > 0) | split(" ") | {part: .[0], file: .[1], target: (if .[2] == "-" then "" else .[2] end)})')" >> "$GITHUB_OUTPUT"
      - name: Image names, from the branding module
        id: names
        run: |
          (cd core && npm ci --no-audit --no-fund && npm run build)
          cd host && npm ci --no-audit --no-fund
          # Bundled first, as host's build does: core's built output uses imports Node's own loader refuses.
          node --input-type=module >> "$GITHUB_OUTPUT" <<'EOF'
          import { build } from 'esbuild'
          const out = await build({
            stdin: { contents: "export { imageName } from '@agenthix/core'", resolveDir: '.' },
            bundle: true, platform: 'node', format: 'esm', write: false,
          })
          const { imageName } = await import(`data:text/javascript;base64,${Buffer.from(out.outputFiles[0].text).toString('base64')}`)
          const { readFileSync } = await import('node:fs')
          const parts = Object.keys(JSON.parse(readFileSync('../scripts/images/parts.json', 'utf8')).parts)
          console.log(`names=${JSON.stringify(Object.fromEntries(parts.map(p => [p, imageName(p)])))}`)
          EOF

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: What is reused and what is missing
        id: plan
        env:
          KEYS: ${{ steps.keys.outputs.keys }}
          IMAGES: ${{ steps.keys.outputs.images }}
          NAMES: ${{ steps.names.outputs.names }}
          REGISTRY: ${{ steps.registry.outputs.registry }}
        run: |
          plan="$(scripts/release/plan.sh)"
          echo "plan=$plan" >> "$GITHUB_OUTPUT"
          missing="$(jq -c '[.[] | select(.status == "missing")]' <<<"$plan")"
          echo "missing=$missing" >> "$GITHUB_OUTPUT"
          echo "missing_count=$(jq length <<<"$missing")" >> "$GITHUB_OUTPUT"
          {
            echo '### What is built and what is reused'
            echo
            echo '| Part | Architecture | Key | |'
            echo '|---|---|---|---|'
            jq -r '.[] | "| \(.part) | \(.arch) | `\(.key[0:12])` | \(if .status == "reused" then "reused, attested" else "to be built" end) |"' <<<"$plan"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: "Build ${{ matrix.part }} (${{ matrix.arch }})"
    needs: prepare
    if: needs.prepare.outputs.missing_count != '0'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      # Keyless attestation: the workflow's own identity token is exchanged for a short-lived signing certificate.
      id-token: write
    strategy:
      # Every image is reported, so one failing does not hide the others; the candidate needs them all.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.missing) }}
    env:
      LABELS: |
        org.opencontainers.image.title=${{ matrix.name }}
        org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
        org.opencontainers.image.licenses=Elastic-2.0
        content-key=${{ matrix.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
      # The agent and executor images share one tools stage, and carry its content key as a label: hq compares it to
      # decide whether an approved workflow survives an image upgrade.
      - name: Label the tools stage key
        if: matrix.part == 'agent' || matrix.part == 'executor'
        run: |
          {
            echo 'LABELS<<LABELS_END'
            printf '%s\n' "$LABELS"
            echo "tools-stage-key=$(node scripts/images/keys.mjs --tools-key)"
            echo 'LABELS_END'
          } >> "$GITHUB_ENV"
      # Nothing is emulated: each runner builds its own architecture, hq's Wasp stage included (hq/docker/Dockerfile).
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Built into this runner's Docker first, and started there: an image that does not start and answer is never
      # pushed.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ env.LABELS }}
          provenance: false
          # The robots bundle is a release asset of this repository, fetched in hq's image build (hq/docker/Dockerfile).
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          load: true
          tags: imgtest/${{ matrix.part }}:${{ matrix.arch }}
      - name: Start it
        env:
          PART: ${{ matrix.part }}
          ARCH: ${{ matrix.arch }}
        run: scripts/images/start-test.sh "$PART" "imgtest/$PART:$ARCH"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The same build again, every layer from the builder's cache: the image pushed is made of the layers that
      # were started. It is tagged build-<key>-<arch>, a name that says only what it was built from, never a version.
      - name: Push it
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ env.LABELS }}
          provenance: false
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          outputs: type=image,name=${{ matrix.image }}:build-${{ matrix.key }}-${{ matrix.arch }},push=true
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      # Only after the start test passed: a reader that finds the attestation knows the image started and answered.
      - name: Attest it
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          PART: ${{ matrix.part }}
          ARCH: ${{ matrix.arch }}
          KEY: ${{ matrix.key }}
        run: |
          printf '%s' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$' || { echo "::error::No digest for $IMAGE"; exit 1; }
          jq -n -c --arg part "$PART" --arg arch "$ARCH" --arg key "$KEY" --arg commit "$(git rev-parse HEAD)" \
            '{part: $part, arch: $arch, key: $key, commit: $commit}' > "$RUNNER_TEMP/predicate.json"
          cosign attest --yes --type custom --predicate "$RUNNER_TEMP/predicate.json" "$IMAGE@$DIGEST"
      # The check a later run makes before it reuses this image, made now, so an attestation that would be refused fails here.
      # The ref this run is on counts too, so that a dry run of Release on a fix branch passes; a run on that branch still
      # reuses, and a tag still promotes, only what main or a release branch attested.
      - name: Check that it would be reused
        env:
          ATTESTED_REF: ${{ github.ref }}
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          PART: ${{ matrix.part }}
          ARCH: ${{ matrix.arch }}
          KEY: ${{ matrix.key }}
        run: |
          found="$(scripts/release/reuse.sh "$IMAGE" "$PART" "$ARCH" "$KEY")"
          test "$found" = "$DIGEST" || { echo "::error::The registry holds $found for $IMAGE:build-$KEY-$ARCH, not $DIGEST."; exit 1; }
      - name: Keep the digest for the candidate
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          PART: ${{ matrix.part }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/built"
          jq -n -c --arg part "$PART" --arg arch "$ARCH" --arg digest "$DIGEST" '{part: $part, arch: $arch, digest: $digest}' > "$RUNNER_TEMP/built/$PART-$ARCH.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: built-${{ matrix.part }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/built/*.json
          if-no-files-found: error
          retention-days: 1

  candidate:
    name: The release candidate
    needs: [prepare, build]
    # The builds are skipped when everything is reused; a failed build ends the run here.
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      digests: ${{ steps.record.outputs.digests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.prepare.outputs.missing_count != '0'
        with:
          pattern: built-*
          path: ${{ runner.temp }}/built
          merge-multiple: true
      - name: Write the record
        id: record
        env:
          PLAN: ${{ needs.prepare.outputs.plan }}
        run: |
          printf '%s' "$PLAN" > "$RUNNER_TEMP/plan.json"
          mkdir -p "$RUNNER_TEMP/built" "$RUNNER_TEMP/candidate"
          node scripts/release/candidate.mjs --plan "$RUNNER_TEMP/plan.json" --built "$RUNNER_TEMP/built" \
            --commit "$(git rev-parse HEAD)" --tree "$(git rev-parse 'HEAD^{tree}')" \
            --out "$RUNNER_TEMP/candidate/candidate.json" --summary "$GITHUB_STEP_SUMMARY"
          echo "digests=$(jq -c '.parts | map_values(.platforms.amd64.digest)' "$RUNNER_TEMP/candidate/candidate.json")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate
          path: ${{ runner.temp }}/candidate/candidate.json
          if-no-files-found: error
          retention-days: 90

  # Installed from the candidate's own images, built by nothing here.
  install-test:
    name: Install test
    needs: [prepare, candidate]
    # The build job is skipped when every image is reused, and a skipped job would skip this one too without it.
    if: ${{ !cancelled() && needs.candidate.result == 'success' }}
    uses: ./.github/workflows/install-test.yml
    permissions:
      contents: read
      packages: read
    with:
      commit: ${{ inputs.commit || github.sha }}
      registry: ${{ needs.prepare.outputs.registry }}
      names: ${{ needs.prepare.outputs.names }}
      digests: ${{ needs.candidate.outputs.digests }}

  guide-screenshots:
    name: Guide screenshots
    needs: candidate
    # The build job is skipped when every image is reused, and a skipped job would skip this one too without it.
    if: ${{ !cancelled() && needs.candidate.result == 'success' }}
    uses: ./.github/workflows/guide-screenshots.yml
    permissions:
      contents: read
    with:
      commit: ${{ inputs.commit || github.sha }}

  core:
    name: "Core package: build, check and pack"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Build and check
        working-directory: core
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
          npm run check:package
      # While the repository is private the package goes to GitHub's npm registry, under the repository owner's scope,
      # which that registry requires; at the first release this is where it moves to the public registry.
      - name: Name it
        working-directory: core
        run: |
          # Registry scopes are lower case, and this registry's scope is the repository owner.
          npm pkg set "name=@${GITHUB_REPOSITORY_OWNER,,}/core"
      # core has no lifecycle scripts, so the packed file is exactly what the registry would receive from the folder.
      - name: Pack it
        working-directory: core
        run: |
          mkdir -p "$RUNNER_TEMP/core-package"
          npm pack --pack-destination "$RUNNER_TEMP/core-package"
          count="$(find "$RUNNER_TEMP/core-package" -maxdepth 1 -name '*.tgz' | wc -l)"
          test "$count" -eq 1 || { echo "::error::Expected one packed file, found $count."; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-package
          path: ${{ runner.temp }}/core-package/*.tgz
          if-no-files-found: error
          retention-days: 7

  proved:
    # The run passes only when every part of the release bar ran and passed: a skipped install test or set of
    # screenshots would otherwise leave the run passed, and the tag publishes what a passed run proved.
    name: The release bar passed
    if: always()
    needs: [prepare, candidate, install-test, guide-screenshots, core]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every part of the bar ran and passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || { echo "::error::A part of the release bar did not pass ($r)."; exit 1; }; done
