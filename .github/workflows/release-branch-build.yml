name: Release branch build

# Part of the release bar: on every push to a release branch, whatever it changes, the release's own build
# (release-build.yml) runs with publishing off — every image for amd64 and arm64, built and started exactly as the
# tag builds them, and core built, checked and packed as the tag publishes it. A tag is published only once this
# passed for the tagged commit on its release branch (publish-images.yml).
on:
  push:
    branches: ['release/**']

concurrency:
  group: release-branch-build-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: Release build
    uses: ./.github/workflows/release-build.yml
    # Reading the repository is all it needs: nothing is pushed or published from a branch.
    permissions:
      contents: read
    with:
      publish: false
