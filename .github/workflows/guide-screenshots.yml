name: Guide screenshots

# Captures the user guide's screenshots from the sample organisation and compares each with the one its page links, in
# the release that holds it (hq/scripts/guide/compare.mjs). Called twice by Release (release.yml): first for the
# commit it starts from, whose set the pin step reads (docs/guide/README.md), then by Release build (release-build.yml)
# for the commit it proves, which release-build also calls for every push to a release branch and every run of it by
# hand, so the screenshots are part of the release bar before the tag. Such a run keeps the release set, from which
# Publish release (publish-images.yml) attaches to the tag's release the screenshots the pages link to that tag. The tag
# captures nothing. Also a run by hand on any branch. main and pull requests do not run it.
on:
  workflow_call:
    inputs:
      commit:
        description: 'The commit to capture'
        required: false
        type: string
        default: ''
      artifact-prefix:
        # Called twice in one Release run, whose artifacts share one namespace: the pin step's capture is kept as
        # pin-guide-release-set, and the release build's as guide-release-set, the one a tag takes.
        description: 'Put before the name of each artifact this run keeps'
        required: false
        type: string
        default: ''
  workflow_dispatch:

permissions: {}

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agenthix
          POSTGRES_PASSWORD: agenthix
          POSTGRES_DB: agenthix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agenthix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The guide databases sit on the one Postgres service; with-guide-db.mjs creates and migrates both.
      GUIDE_HQ_DATABASE_URL: postgresql://agenthix:agenthix@localhost:5432/agenthix_guide
      GUIDE_SITE_DATABASE_URL: postgresql://agenthix:agenthix@localhost:5432/agenthix_site_guide
      WASP_TELEMETRY_DISABLE: '1'
      CI: 'true'
      # Building Wasp's SDK and hq's server bundle type-check every operation, and grew past Node's default heap on the
      # runner (as in Checks). The capture script sets it for its own children too.
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          # The comparison finds the last release tag from the history.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install
        run: |
          (cd core && npm ci --no-audit --no-fund && npm run build)
          # ui's peers (React and its types) are not installed in ui: hq's own copies are linked in after hq's
          # install, as hq's Dockerfile does, because two copies of @types/react type-check as unrelated types.
          (cd ui && npm install --no-audit --no-fund)
          (cd site && npm ci --no-audit --no-fund)
          (cd hq && npm install --no-audit --no-fund)
          mkdir -p ui/node_modules/@types
          for p in react react-dom lucide-react; do rm -rf "ui/node_modules/$p"; ln -sfn "../../hq/node_modules/$p" "ui/node_modules/$p"; done
          for p in react react-dom; do rm -rf "ui/node_modules/@types/$p"; ln -sfn "../../../hq/node_modules/@types/$p" "ui/node_modules/@types/$p"; done
          test -e ui/node_modules/@types/react/index.d.ts
          # The Fleet Console's screens are captured from their build (hq/e2e/guide/consoleCapture.ts); Vite dedupes React.
          (cd console-web && npm ci --no-audit --no-fund)
          cd hq
          # The Wasp CLI is the version hq pins as a dev dependency, never a global one.
          npx wasp install
          npx wasp compile
          npx playwright install --with-deps chromium

      # The one capture the release rehearsal and the regression run too (scripts/guide/capture.mjs): it builds hq,
      # starts hq and the site on ports the runner gives, against the guide databases, captures, and stops them.
      - name: Capture the screenshots
        run: node scripts/guide/capture.mjs --logs "$RUNNER_TEMP/guide-logs"

      - name: Compare with the released screenshots
        if: always()
        working-directory: hq
        env:
          # The releases the pages link are read through the API while the repository is private; contents: read
          # covers a release's assets.
          GH_TOKEN: ${{ github.token }}
        run: npm run guide:compare

      - name: Show the report on the run's page
        if: always()
        run: |
          if [ -f hq/e2e/guide/.report/summary.md ]; then cat hq/e2e/guide/.report/summary.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Keep the report and the changed screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-prefix }}guide-report
          path: hq/e2e/guide/.report
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

      # The set a tag on this commit takes its screenshots from: from a release build started by hand or on a release
      # branch, and only when it all passed.
      - name: Keep the release set
        # A run called for a commit (by Release or the release build) keeps it whatever started its caller: a called
        # workflow sees its caller's event.
        if: (startsWith(github.ref, 'refs/heads/release/') || github.event_name == 'workflow_dispatch' || inputs.commit != '') && success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-prefix }}guide-release-set
          path: hq/e2e/guide/.captures
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      - name: Keep the logs and traces of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-prefix }}guide-failure-logs
          path: |
            ${{ runner.temp }}/guide-logs
            hq/test-results
          if-no-files-found: ignore
          retention-days: 7
