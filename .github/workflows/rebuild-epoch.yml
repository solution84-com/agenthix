name: Rebuild epoch

# Once a month, opens a pull request that raises the rebuild epoch in scripts/images/parts.json by one. The epoch is
# part of every image part's content key (scripts/images/keys.mjs), so raising it makes the next release build every
# image again and take the security updates of its base images and system packages, even where no code changed.
# The pull request is merged by a maintainer like any other. A pull request opened with the workflow's own token does
# not start the other workflows by itself: a maintainer re-runs the checks (for example by closing and reopening it).
on:
  schedule:
    - cron: '17 4 1 * *'
  workflow_dispatch:

concurrency:
  group: rebuild-epoch
  cancel-in-progress: false

permissions: {}

jobs:
  raise:
    name: Raise the rebuild epoch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Raise it by one and open the pull request
        run: |
          set -euo pipefail
          existing="$(gh pr list --state open --head 'chore/rebuild-epoch' --json number --jq 'length')"
          if [ "$existing" -gt 0 ]; then
            echo "A pull request raising the rebuild epoch is already open; nothing to do."
            exit 0
          fi
          next="$(node -e "
            const fs = require('node:fs')
            const file = 'scripts/images/parts.json'
            const text = fs.readFileSync(file, 'utf8')
            const next = JSON.parse(text).rebuildEpoch + 1
            fs.writeFileSync(file, text.replace(/\"rebuildEpoch\":\s*\d+/, '\"rebuildEpoch\": ' + next))
            console.log(next)
          ")"
          git diff --quiet && { echo "::error::The rebuild epoch was not changed in scripts/images/parts.json."; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c chore/rebuild-epoch
          git commit -am "chore(images): rebuild epoch $next"
          git push origin chore/rebuild-epoch
          gh pr create --base main --head chore/rebuild-epoch \
            --title "chore(images): rebuild epoch $next" \
            --body "Raises the rebuild epoch to $next, so every image part is built again at the next release and takes the security updates of its base images and system packages. Opened by the monthly schedule."
