name: Take the updates

# The month's minor and patch updates, proved by Checks before they reach main (the releasing skill;
# docs/architecture/dependencies.md). Release starts it, with its version and then_release, when the updates are more
# than a month old, and this starts that Release again once they are on main; so they are taken at most once a month,
# always just before a release, and that release's own build is their image build: if it fails, nothing is tagged or
# published, and the fix is proved by a Release dry run on its branch, as any fix is. It can also be started by hand:
#   gh workflow run take-updates.yml --ref main
#   gh workflow run take-updates.yml --ref main -f branch=updates/2026-12-01   (prove a fixed branch)
#
# 1. The updates (scripts/deps/update.sh): npm within each module's ranges, lockfiles only; every base image to its
#    tag's newest digest within its major, and Node and cosign everywhere they are named; every action to its major's
#    newest release. The run is recorded in scripts/deps/taken.json, which Release's first stage reads, and the rebuild
#    epoch in scripts/images/parts.json is raised by one, every run, so every image is built again and takes its system
#    packages' fixes. That job holds no secret: the packages it installs run their own scripts.
# 2. The change is pushed as one commit to updates/<date>, outside release/**, so the push starts no workflow by itself.
#    It is pushed with the release-pin deploy key: a workflow's own token may not change workflow files, and the
#    updated action pins are in them.
# 3. Checks is started on that branch (scripts/release/dispatch.sh) and waited for, with every job selected.
# 4. Checks passed: main is moved to the branch's commit by a fast-forward, pushed with the release-pin deploy key (which
#    may bypass main's ruleset), refused if main moved meanwhile; the branch is deleted. Either failed: nothing moves,
#    the branch stays, and the summary names the failed run and jobs. Fix it on that branch, then run this again with
#    the branch as input: the updates are skipped and the branch is proved as it stands.
# 5. Started by Release (then_release): once main moved, Release is started again on main with the same version.
#
# Never at the same time as a real Release: they share one concurrency group.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version of the release to start afterwards (with then_release; Release sets both)'
        required: false
        type: string
        default: ''
      branch:
        description: 'An updates/<date> branch to prove again as it stands, skipping the updates'
        required: false
        type: string
        default: ''
      then_release:
        description: 'Once the updates are on main, start Release on main with this version (Release sets it)'
        required: false
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  update:
    name: "1. Take the updates"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      branch: ${{ steps.branch.outputs.branch }}
      commit: ${{ steps.commit.outputs.commit }}
      node: ${{ steps.commit.outputs.node }}
    env:
      BRANCH_INPUT: ${{ inputs.branch }}
      THEN_RELEASE: ${{ inputs.then_release }}
      VERSION: ${{ inputs.version }}
      WASP_TELEMETRY_DISABLE: '1'
      # Wasp's compile type-checks its generated code, which needs more than Node's default heap, as in Checks.
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Started on main, with a branch to prove only under updates/
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Take the updates runs on main, not $GITHUB_REF_NAME: start it with --ref main."
            exit 1
          fi
          if [ "$THEN_RELEASE" = true ] && [ -z "$VERSION" ]; then
            echo "::error::then_release needs the version of the release to start."
            exit 1
          fi
          if [ -n "$BRANCH_INPUT" ] && [[ "$BRANCH_INPUT" != updates/* ]]; then
            echo "::error::Only an updates/<date> branch this workflow made is proved and moved onto main, not $BRANCH_INPUT."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: The branch
        id: branch
        env:
          # Only this step holds the token, to read whether the branch exists (the repository may be private); the
          # update step after it runs packages' scripts and holds none.
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$BRANCH_INPUT" ]; then branch="$BRANCH_INPUT"; else branch="updates/$(date -u +%F)"; fi
          if [ -z "$BRANCH_INPUT" ] && gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" > /dev/null 2>&1; then
            echo "::error::$branch is already there: prove it with the branch input, or delete it and run this again."
            exit 1
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - name: The update scripts' own tests
        if: inputs.branch == ''
        run: node --test "scripts/deps/__tests__/*.test.mjs"
      - name: Take the updates
        if: inputs.branch == ''
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          scripts/deps/update.sh --record --summary "$RUNNER_TEMP/moved.md"
      - name: Commit them
        id: commit
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          if [ -z "$BRANCH_INPUT" ]; then
            git add -A
            git commit --quiet -m "chore(deps): take the updates of ${BRANCH#updates/}"
            # Only the new commit travels to the job that pushes it, which runs nothing of what it holds.
            git bundle create "$RUNNER_TEMP/updates.bundle" "$GITHUB_SHA..HEAD"
          else
            node scripts/deps/record.mjs --taken scripts/deps/taken.json > "$RUNNER_TEMP/moved.md"
          fi
          {
            echo "### What moved, on $BRANCH"
            echo
            cat "$RUNNER_TEMP/moved.md"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "node=$(node -p "require('./scripts/deps/taken.json').moved.Node?.[0]?.to ?? ''")" >> "$GITHUB_OUTPUT"
      - if: inputs.branch == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: updates-bundle
          path: ${{ runner.temp }}/updates.bundle
          if-no-files-found: error
          retention-days: 7

  push:
    name: "2. Push the branch"
    needs: update
    if: inputs.branch == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The deploy key is in this environment, which only main and release/* may use; this workflow runs on main.
    environment: release-pin
    permissions:
      contents: read
    env:
      BRANCH: ${{ needs.update.outputs.branch }}
      COMMIT: ${{ needs.update.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.RELEASE_PIN_DEPLOY_KEY }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: updates-bundle
          path: ${{ runner.temp }}/bundle
      - name: Push it
        run: |
          git fetch --quiet "$RUNNER_TEMP/bundle/updates.bundle" HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$COMMIT" || { echo "::error::The bundle holds $(git rev-parse FETCH_HEAD), not $COMMIT."; exit 1; }
          git push --quiet origin "$COMMIT:refs/heads/$BRANCH"
          echo "Pushed $COMMIT to $BRANCH." | tee -a "$GITHUB_STEP_SUMMARY"

  prove:
    name: "3. Checks"
    needs: [update, push]
    # The push is skipped when a branch is proved as it stands.
    if: ${{ !cancelled() && needs.update.result == 'success' && (needs.push.result == 'success' || needs.push.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      # Starts Checks and reads its run.
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ needs.update.outputs.branch }}
    outputs:
      passed: ${{ steps.wait.outputs.passed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start them
        id: start
        run: |
          checks="$(scripts/release/dispatch.sh checks.yml "$BRANCH")"
          echo "checks=$checks" >> "$GITHUB_OUTPUT"
          echo "Checks on $BRANCH: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$checks" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Wait for it
        id: wait
        env:
          CHECKS: ${{ steps.start.outputs.checks }}
        run: |
          gh run watch "$CHECKS" --repo "$GITHUB_REPOSITORY" --interval 60 > /dev/null || true
          conclusion="$(gh run view "$CHECKS" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$CHECKS"
          if [ "$conclusion" = success ]; then
            echo "Checks passed." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "passed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          failed="$(gh run view "$CHECKS" --repo "$GITHUB_REPOSITORY" --json jobs \
            --jq '[.jobs[] | select(.conclusion != "success" and .conclusion != "skipped") | .name] | join("; ")')"
          echo "::error::Checks did not pass ($conclusion): $url. Jobs: ${failed:-none named}."
          echo "**Checks did not pass** ($conclusion): $url. Jobs: ${failed:-none named}." >> "$GITHUB_STEP_SUMMARY"
          echo "passed=false" >> "$GITHUB_OUTPUT"
          exit 1

  land:
    name: "4. Move main"
    needs: [update, prove]
    if: ${{ !cancelled() && needs.prove.outputs.passed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-pin
    permissions:
      contents: read
    env:
      BRANCH: ${{ needs.update.outputs.branch }}
      COMMIT: ${{ needs.update.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.RELEASE_PIN_DEPLOY_KEY }}
      - name: Fast-forward main to the proved commit, and delete the branch
        run: |
          tip="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          if [ "$tip" != "$COMMIT" ]; then
            echo "::error::$BRANCH moved to ${tip:-nothing} while $COMMIT was proved: run this again with the branch as input."
            exit 1
          fi
          git fetch --quiet origin "refs/heads/$BRANCH"
          # Not forced: refused unless main is still an ancestor of the proved commit.
          if ! git push --quiet origin "$COMMIT:refs/heads/main"; then
            # The proved commit is stale: the branch goes, so the next run starts from main as it is now.
            git push --quiet origin --delete "$BRANCH" || true
            echo "::error::main moved since the updates were taken, so $COMMIT is not a fast-forward of it; $BRANCH is deleted. Run Release (or Take the updates) again."
            exit 1
          fi
          git push --quiet origin --delete "$BRANCH"
          echo "main is now $COMMIT; $BRANCH is deleted." | tee -a "$GITHUB_STEP_SUMMARY"

  release:
    name: "5. Start the release again"
    needs: land
    if: ${{ !cancelled() && needs.land.result == 'success' && inputs.then_release }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Starts Release.
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release on main, with the updates in
        run: |
          run="$(scripts/release/dispatch.sh release.yml main -f "version=$VERSION")"
          echo "Release $VERSION started on main: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run" | tee -a "$GITHUB_STEP_SUMMARY"

  summary:
    name: Where the updates stand
    needs: [update, push, prove, land]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      BRANCH: ${{ needs.update.outputs.branch }}
      NODE_TO: ${{ needs.update.outputs.node }}
      LANDED: ${{ needs.land.result }}
      THEN_RELEASE: ${{ inputs.then_release }}
    steps:
      - name: What happened, and what to do locally
        run: |
          {
            echo '### Take the updates'
            echo
            if [ "$LANDED" = success ]; then
              echo "The updates are on main. On every checkout: \`git pull\` on main; the dev start (scripts/dev/fresh.sh) then installs each module whose lockfile changed."
              if [ -n "$NODE_TO" ]; then echo; echo "Node moved to $NODE_TO (.nvmrc): install it on the dev machine (\`nvm install\`)."; fi
              echo
              if [ "$THEN_RELEASE" = true ]; then echo 'Release is started again on main (job 5).'; else echo 'Next: run Release from main.'; fi
            elif [ -n "$BRANCH" ]; then
              echo "Nothing moved on main. Fix what failed on $BRANCH, then run Take the updates again with branch=$BRANCH."
            else
              echo 'Nothing moved on main, and no branch was made: see the first job.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$LANDED" = success ]
