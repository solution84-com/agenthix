name: Checks

# Typecheck and unit tests for every package on each pull request and each push to main or a release branch, and the
# two apps' integration suites against a Postgres service. The images are not built here: on a release branch the
# release's own build does that, for both architectures (release-build.yml), and on main and pull requests the
# full regression starts them before a unit merges. There is no linter in the repository, so none runs here. A tag is
# published only once "All checks passed" has passed for the tagged commit (publish-images.yml).
on:
  pull_request:
  push:
    branches: [main, 'release/**']
  workflow_dispatch:

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  changes:
    # Which jobs this change reaches (scripts/affected.mjs, which derives the dependency map from each package.json),
    # and, on a push, whether this very tree already passed: the same commit in another branch's run, or a parent
    # whose tree is identical. Documentation alone reaches no job; the guide is not documentation here, because the
    # Fleet Console builds its Help from docs/guide/ and hq checks its screenshot names. A manual run selects all.
    name: "What changed"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    outputs:
      jobs: ${{ steps.select.outputs.jobs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: The selector's own tests
        # Plain Node, no install: the secure-page check needs TypeScript, and its own job installs and tests it.
        run: node --test scripts/__tests__/affected.test.mjs scripts/__tests__/checks-verdict.test.mjs scripts/__tests__/image-keys.test.mjs scripts/__tests__/free-disk.test.mjs scripts/__tests__/image-parts.test.mjs scripts/__tests__/tools-stage.test.mjs
      - name: Has this tree already passed?
        id: proof
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.sha }}
        run: |
          tree="$(git rev-parse "$HEAD^{tree}")"
          proof=""
          # The same commit first, then each parent whose tree is the same.
          candidates="$HEAD"
          for parent in $(git rev-list --parents -n 1 "$HEAD" | cut -d' ' -f2-); do
            if [ "$(git rev-parse "$parent^{tree}")" = "$tree" ]; then candidates="$candidates $parent"; fi
          done
          for sha in $candidates; do
            passes="$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?check_name=All%20checks%20passed" \
              --jq '[.check_runs[] | select(.conclusion == "success")] | length' 2>/dev/null || echo 0)"
            if [ "${passes:-0}" -gt 0 ]; then proof="$sha"; break; fi
          done
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "proof=$proof" >> "$GITHUB_OUTPUT"
      - name: Which jobs does this change reach?
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
          PROOF: ${{ steps.proof.outputs.proof }}
          TREE: ${{ steps.proof.outputs.tree }}
        run: |
          {
            echo "### What this run checks"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PROOF" ]; then
            selected='[]'
            echo "Nothing: tree \`$TREE\` already passed *All checks passed* on commit \`$PROOF\`, so no job runs again." >> "$GITHUB_STEP_SUMMARY"
            echo "Tree already proved by $PROOF"
          else
            if [ "$EVENT" = workflow_dispatch ]; then set -- --all; else set -- "$BASE" "$HEAD"; fi
            # A push is diffed against the push before it. If that one did not pass, what it left unchecked is not
            # proved by this diff, so a documentation-only push after a failing push must not pass: run everything.
            if [ "$EVENT" = push ] && ! [[ "$BASE" =~ ^0+$ ]]; then
              passes="$(gh api "repos/$GITHUB_REPOSITORY/commits/$BASE/check-runs?check_name=All%20checks%20passed" \
                --jq '[.check_runs[] | select(.conclusion == "success")] | length' 2>/dev/null || echo 0)"
              if [ "${passes:-0}" -eq 0 ]; then
                set -- --all
                echo "The push before this one (\`$BASE\`) did not pass *All checks passed*, so every job runs." >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
            selected="$(node scripts/affected.mjs "$@" --json | node -e 'process.stdout.write(JSON.stringify(JSON.parse(require("fs").readFileSync(0, "utf8")).selected))')"
            {
              echo '```'
              node scripts/affected.mjs "$@"
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "jobs=$selected" >> "$GITHUB_OUTPUT"
      - name: The guide's screenshot links
        # Every screenshot a guide page or the README links has a recipe, every recipe is linked, and each link names a
        # release (hq/scripts/guide/check-names.mjs: plain Node, no install, about a second). Only when the guide, its
        # recipes, its scripts or the README changed; a manual run or a new branch's first push checks always.
        if: steps.proof.outputs.proof == ''
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] || [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then
            touched=yes
          else
            touched="$(git diff --name-only "$BASE" "$HEAD" -- docs/guide hq/e2e/guide hq/scripts/guide README.md | head -1)"
          fi
          if [ -n "$touched" ]; then
            node hq/scripts/guide/check-names.mjs
          else
            echo "Neither the guide, its recipes, its scripts nor the README changed."
          fi

  secure-page:
    # A browser gives some features (crypto.randomUUID, the clipboard, the microphone) only to a secure page, and HQ
    # is also opened over plain http at a network address, so browser code reaches them only through a helper.
    name: "Browser code needs no secure page"
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'secure-page')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: The check's own tests
        run: node --test scripts/__tests__/check-secure-page.test.mjs
      - name: No direct use of a secure-page-only feature
        run: node scripts/check-secure-page.mjs

  core:
    name: "Core: typecheck, unit tests and build"
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'core')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep   # the file tools' grep runs it
          cd core && npm ci --no-audit --no-fund
      - name: Typecheck and unit tests
        run: |
          cd core && npm test   # runs the typecheck first (pretest)
      - name: Build
        run: |
          cd core && npm run build
      # As a project outside this repository installs it: plain Node, and TypeScript's Node module rules.
      - name: Check the package
        run: |
          cd core && npm run check:package

  ui:
    name: "UI: typecheck and unit tests"
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'ui')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      WASP_TELEMETRY_DISABLE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install
        run: |
          (cd core && npm ci --no-audit --no-fund && npm run build)
          (cd ui && npm install --legacy-peer-deps --no-audit --no-fund)
          (cd hq && npm install --no-audit --no-fund)
      - name: Link hq's React into ui
        run: |
          # ui's peers (React and its types) are not installed in ui: hq's own copies are linked in after hq's
          # install, as hq's Dockerfile does, because two copies of @types/react type-check as unrelated types.
          mkdir -p ui/node_modules/@types
          for p in react react-dom lucide-react; do rm -rf "ui/node_modules/$p"; ln -sfn "../../hq/node_modules/$p" "ui/node_modules/$p"; done
          for p in react react-dom; do rm -rf "ui/node_modules/@types/$p"; ln -sfn "../../../hq/node_modules/@types/$p" "ui/node_modules/@types/$p"; done
          test -e ui/node_modules/@types/react/index.d.ts
      - name: Typecheck
        run: |
          cd ui && npx tsc --noEmit
      - name: Unit tests
        run: |
          cd ui && npm test

  hq:
    name: "hq: typecheck and unit tests"
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'hq')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      WASP_TELEMETRY_DISABLE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install
        run: |
          (cd core && npm ci --no-audit --no-fund && npm run build)
          (cd ui && npm install --legacy-peer-deps --no-audit --no-fund)
          (cd hq && npm install --no-audit --no-fund)
      - name: Link hq's React into ui
        run: |
          # ui's peers (React and its types) are not installed in ui: hq's own copies are linked in after hq's
          # install, as hq's Dockerfile does, because two copies of @types/react type-check as unrelated types.
          mkdir -p ui/node_modules/@types
          for p in react react-dom lucide-react; do rm -rf "ui/node_modules/$p"; ln -sfn "../../hq/node_modules/$p" "ui/node_modules/$p"; done
          for p in react react-dom; do rm -rf "ui/node_modules/@types/$p"; ln -sfn "../../../hq/node_modules/@types/$p" "ui/node_modules/@types/$p"; done
          test -e ui/node_modules/@types/react/index.d.ts
      - name: Install the Wasp dependencies and compile
        # Building Wasp's SDK type-checks every operation, and grew past Node's default heap on the runner.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          cd hq
          # The Wasp CLI is the version hq pins as a dev dependency, never a global one.
          npx wasp install
          npx wasp compile
      - name: Typecheck
        # hq's own type check grew past Node's default heap on the runner too.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          cd hq && npm run typecheck
      # The guide's recipes and sample data, which otherwise are type-checked only when the screenshots are taken. The
      # Fleet Console's recipes import console-web's own types, so console-web is installed first.
      - name: Typecheck the guide
        run: |
          (cd console-web && npm ci --no-audit --no-fund)
          cd hq && npm run typecheck:guide
      - name: Unit tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep   # the knowledge search and the platform guide run it
          cd hq && npm test
      - name: hq-web's start-time address step
        run: |
          sh hq/docker/test/web-address.test.sh

  host:
    name: "host: typecheck and unit tests"
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'host')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install
        run: |
          (cd core && npm ci --no-audit --no-fund && npm run build)
          (cd host && npm ci --no-audit --no-fund)
      - name: Typecheck
        run: |
          cd host && npm run typecheck
      - name: Unit tests
        run: |
          cd host && npm test
      - name: Build
        run: |
          cd host && npm run build
      # Each bundle started, as the image starts it: a bundle that type-checks and passes its tests can still fail to load.
      - name: The bundles load
        run: |
          cd host && npm run check:bundles

  console:
    name: "console: typecheck and unit tests"
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'console')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install
        run: |
          (cd core && npm ci --no-audit --no-fund && npm run build)
          (cd console && npm ci --no-audit --no-fund)
      - name: Typecheck
        run: |
          cd console && npm run typecheck
      - name: Unit tests
        run: |
          cd console && npm test
      - name: Build
        run: |
          cd console && npm run build

  relay:
    name: "relay: typecheck, unit tests and build"
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'relay')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install
        run: |
          (cd core && npm ci --no-audit --no-fund && npm run build)
          (cd relay && npm ci --no-audit --no-fund)
      - name: Typecheck
        run: |
          cd relay && npm run typecheck
      - name: Unit tests
        run: |
          cd relay && npm test
      - name: Build
        run: |
          cd relay && npm run build

  console-web:
    name: "console-web: typecheck, unit tests and build"
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'console-web')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install
        run: |
          (cd core && npm ci --no-audit --no-fund && npm run build)
          (cd ui && npm install --legacy-peer-deps --no-audit --no-fund)
          (cd console-web && npm ci --no-audit --no-fund)
          # ui's peers (React and its types) are not installed in ui: console-web's own copies are linked in, as
          # the hq job links hq's, so ui's components and console-web type-check against one React.
          mkdir -p ui/node_modules/@types
          for p in react react-dom lucide-react; do rm -rf "ui/node_modules/$p"; ln -sfn "../../console-web/node_modules/$p" "ui/node_modules/$p"; done
          for p in react react-dom; do rm -rf "ui/node_modules/@types/$p"; ln -sfn "../../../console-web/node_modules/@types/$p" "ui/node_modules/@types/$p"; done
          test -e ui/node_modules/@types/react/index.d.ts
      - name: Typecheck
        run: |
          cd console-web && npm run typecheck
      - name: Unit tests
        run: |
          cd console-web && npm test
      - name: Build
        run: |
          cd console-web && npm run build

  site:
    name: "site: typecheck and unit tests"
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'site')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install
        run: |
          (cd core && npm ci --no-audit --no-fund && npm run build)
          (cd site && npm ci --no-audit --no-fund)
          # The OpenCode plugin is its own package inside site, and site's unit tests import it.
          (cd site/opencode-plugin && npm ci --no-audit --no-fund)
      - name: Typecheck
        run: |
          (cd site && npm run typecheck)
          (cd site/opencode-plugin && npm run typecheck)
      - name: Unit tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep   # the knowledge search runs it
          cd site && npm test

  site-integration:
    name: "site: integration tests"
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'site-integration')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agenthix
          POSTGRES_PASSWORD: agenthix
          POSTGRES_DB: agenthix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agenthix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # with-test-db.mjs swaps the database name for agenthix_site_test, creates it and applies the migrations.
      DATABASE_URL: postgresql://agenthix:agenthix@localhost:5432/agenthix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install
        run: |
          (cd core && npm ci --no-audit --no-fund && npm run build)
          (cd site && npm ci --no-audit --no-fund)
      - name: Integration tests
        run: |
          cd site && npm run test:integration

  hq-integration:
    name: "hq: integration tests"
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'hq-integration')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agenthix
          POSTGRES_PASSWORD: agenthix
          POSTGRES_DB: agenthix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agenthix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WASP_TELEMETRY_DISABLE: '1'
      # with-test-db.mjs makes one agenthix_w<N>_test database per worker from this one's address.
      DATABASE_URL: postgresql://agenthix:agenthix@localhost:5432/agenthix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install
        run: |
          (cd core && npm ci --no-audit --no-fund && npm run build)
          (cd ui && npm install --legacy-peer-deps --no-audit --no-fund)
          (cd hq && npm install --no-audit --no-fund)
      - name: Link hq's React into ui
        run: |
          # ui's peers (React and its types) are not installed in ui: hq's own copies are linked in after hq's
          # install, as hq's Dockerfile does, because two copies of @types/react type-check as unrelated types.
          mkdir -p ui/node_modules/@types
          for p in react react-dom lucide-react; do rm -rf "ui/node_modules/$p"; ln -sfn "../../hq/node_modules/$p" "ui/node_modules/$p"; done
          for p in react react-dom; do rm -rf "ui/node_modules/@types/$p"; ln -sfn "../../../hq/node_modules/@types/$p" "ui/node_modules/@types/$p"; done
          test -e ui/node_modules/@types/react/index.d.ts
      - name: Install the Wasp dependencies and compile
        # Building Wasp's SDK type-checks every operation, and grew past Node's default heap on the runner.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          cd hq
          # The Wasp CLI is the version hq pins as a dev dependency, never a global one.
          npx wasp install
          npx wasp compile
      - name: Integration tests
        run: |
          # A key only for this run, which the tests use to encrypt stored secrets.
          SECRETS_MASTER_KEY="$(openssl rand -base64 32)"
          export SECRETS_MASTER_KEY
          cd hq && npm run test:integration

  all-passed:
    # The one check a pull request must pass before it merges, so the rule on main names one job, not each of them.
    # Passes only when "What changed" succeeded, every selected job succeeded and every other job was skipped: a
    # selected job that was skipped or cancelled fails it, and so does one that ran unselected.
    name: "All checks passed"
    if: always()
    needs: [changes, secure-page, core, ui, hq, host, console, console-web, relay, site, site-integration, hq-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every selected job passed and every other was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
          SELECTED: ${{ needs.changes.outputs.jobs }}
        run: node scripts/checks-verdict.mjs
