name: Registry cleanup

# Once a week, deletes from this repository's images in the registry what no release needs: untagged images more than
# a week old, and images tagged build-… only (the release build's, scripts/release/reuse.sh) more than 90 days old;
# in both cases only when no release record (each release's release.json) names it, no kept index points at it, and
# it is no signature or attestation of a kept image (scripts/release/cleanup.mjs). An image with any other tag, a
# release's version tag above all, is never deleted. Started by hand, it is a dry run by default: it lists what it
# would delete and deletes nothing. Only the job that deletes may write to the registry.
on:
  schedule:
    - cron: '41 3 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List what would be deleted, and delete nothing'
        required: true
        type: boolean
        default: true

concurrency:
  group: registry-cleanup
  cancel-in-progress: false

permissions: {}

jobs:
  plan:
    name: What no release needs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    outputs:
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # As the release build works them out: the workflow's token is refused a listing of the owner's packages, so
      # each image is asked for by its name.
      - name: Image names, from the branding module
        id: names
        run: |
          (cd core && npm ci --no-audit --no-fund && npm run build)
          cd host && npm ci --no-audit --no-fund
          # Bundled first, as host's build does: core's built output uses imports Node's own loader refuses.
          node --input-type=module >> "$GITHUB_OUTPUT" <<'EOF'
          import { build } from 'esbuild'
          const out = await build({
            stdin: { contents: "export { imageName } from '@agenthix/core'", resolveDir: '.' },
            bundle: true, platform: 'node', format: 'esm', write: false,
          })
          const { imageName } = await import(`data:text/javascript;base64,${Buffer.from(out.outputFiles[0].text).toString('base64')}`)
          const { readFileSync } = await import('node:fs')
          const parts = Object.keys(JSON.parse(readFileSync('../scripts/images/parts.json', 'utf8')).parts)
          console.log(`names=${JSON.stringify(Object.fromEntries(parts.map(p => [p, imageName(p)])))}`)
          EOF
      - name: The lockfiles are as committed
        run: scripts/deps/held.sh
      - name: The plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_NAMES: ${{ steps.names.outputs.names }}
          DRY_RUN: ${{ github.event_name != 'schedule' && inputs.dry_run }}
        run: |
          node --test scripts/release/__tests__/cleanup.test.mjs
          node scripts/release/cleanup.mjs --out "$RUNNER_TEMP/cleanup.json"
          echo "count=$(jq length "$RUNNER_TEMP/cleanup.json")" >> "$GITHUB_OUTPUT"
          {
            echo '### To delete'
            echo
            echo '| Image | Digest | Why |'
            echo '|---|---|---|'
            jq -r '.[] | "| \(.package) | `\(.digest[0:19])` | \(.reason) |"' "$RUNNER_TEMP/cleanup.json"
            echo
            if [ "$DRY_RUN" = true ]; then echo 'Dry run: nothing is deleted. Run again with dry run off to delete these.'; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cleanup-plan
          path: ${{ runner.temp }}/cleanup.json
          if-no-files-found: error
          retention-days: 30

  delete:
    name: Delete
    needs: plan
    # A scheduled run deletes; a run by hand only when its dry run is turned off.
    if: needs.plan.outputs.count != '0' && (github.event_name == 'schedule' || inputs.dry_run == false)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cleanup-plan
          path: ${{ runner.temp }}/plan
      - name: Delete what the plan lists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -c '.[]' "$RUNNER_TEMP/plan/cleanup.json" | while IFS= read -r entry; do
            path="$(jq -r .path <<<"$entry")"
            [[ "$path" =~ ^(orgs|users)/[^/]+/packages/container/[^/]+/versions/[0-9]+$ ]] || { echo "::error::Not a package version: $path"; exit 1; }
            echo "Deleting $(jq -r '"\(.package) \(.digest): \(.reason)"' <<<"$entry")"
            gh api -X DELETE "$path"
          done
          echo "Deleted $(jq length "$RUNNER_TEMP/plan/cleanup.json") images." | tee -a "$GITHUB_STEP_SUMMARY"
